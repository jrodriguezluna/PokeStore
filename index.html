<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeStore</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/buttons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <script src="/js/draw_navbar.js"></script>

    <section class="py-5 text-dark">
        <div class="container my-5">
            <div class="row align-items-center">
                <div class="col-lg-6"> 
                    <h1 class="display-2 fw-bold mb-3">Bienvenido a PokeStore</h1>
                    <p class="lead text-muted">Nuestra tienda ofrece la mayor variedad de productos pokémon para todos los gustos</p>
                </div>
                <div class="col-lg-5"> 
                    <div id="carouselControls" class="carousel slide carousel-dark" data-bs-ride="carousel">
                        <div class="carousel-inner">
                          <div class="carousel-item active">
                            <img class="d-block w-100" src="/assets/img/products/pikachu_chonk.png" alt="First slide">
                          </div>
                          <div class="carousel-item">
                            <img class="d-block w-100" src="/assets/img/products/evee_tamagotchi.png" alt="Second slide">
                          </div>
                          <div class="carousel-item">
                            <img class="d-block w-100" src="/assets/img/products/evolved_starters_lego.png" alt="Third slide">
                          </div>
                        </div>
                        <a class="carousel-control-prev" href="#carouselControls" role="button" data-bs-slide="prev">
                          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                          <span class="sr-only"></span>
                        </a>
                        <a class="carousel-control-next" href="#carouselControls" role="button" data-bs-slide="next">
                          <span class="carousel-control-next-icon" aria-hidden="true"></span>
                          <span class="sr-only"></span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-5">
    <div class="container">
        <h2 class="mb-5">Los productos que amas al mejor precio:</h2>
        <div class="row g-4" id="contenedor-productos-inicio">
            <!-- contenido dinámico -->
        </div>
    </div>
    </section>
    <script type="module" src="/js/index.js"></script>
  </body>
  
  <footer>

  </footer>

</html>
