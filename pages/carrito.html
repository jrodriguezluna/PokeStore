<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/buttons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body class="bg-light">

    <div id="navbar-placeholder">
      <!-- contenido dinamico -->
    </div>
    <script src="/js/draw_navbar.js"></script>

    <div class="container py-5">
        <h2 class="mb-4">Mi carrito de compras</h2>
        
        <div class="row">
            <!-- Columna Izquierda: Lista de Productos -->
            <div class="col-lg-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body" id="contenedor-items-carrito">
                        <!-- El JavaScript inyectará los productos aquí -->
                        <p class="text-muted">Cargando carrito...</p>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Resumen de Compra -->
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Resumen</h5>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Subtotal:</span>
                            <span class="fw-bold" id="resumen-subtotal">$0.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fs-5">TOTAL:</span>
                            <span class="fw-bold fs-5 text-success" id="resumen-total">$0.00</span>
                        </div>
                        <button class="btn btn-success w-100 btn-lg">PAGAR</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script modular para la lógica del carrito -->
    <script type="module" src="/js/carrito.js"></script>
</body>
</html>
