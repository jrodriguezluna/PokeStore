<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - PokeStore</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/buttons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body class="bg-light">
    <div id="navbar-placeholder"></div>
    <script src="/js/draw_navbar.js"></script>

    <div class="container py-5">
      <div class="row">
        <!-- Barra Lateral de Filtros (Mockup Figura 8) -->
        <aside class="col-lg-3 mb-4">
          <div class="card p-3 shadow-sm border-0 sticky-top" style="top: 85px;">
            <h5 class="fw-bold mb-3">🔍 Filtrar Productos</h5>
            
            <div class="mb-3">
              <label for="buscar-producto" class="form-label small text-muted">Buscar por nombre:</label>
              <input type="text" id="buscar-producto" class="form-control form-control-sm" placeholder="Ej: Pikachu, Peluche...">
            </div>

            <hr>

            <h6 class="fw-bold mb-2 small text-muted">Categorías:</h6>
            <div class="list-group list-group-flush" id="lista-categorias-filtro">
              <button class="list-group-item list-group-item-action active fw-semibold" data-categoria="TODOS">Todas las Categorías</button>
              <button class="list-group-item list-group-item-action" data-categoria="Peluches">Peluches</button>
              <button class="list-group-item list-group-item-action" data-categoria="Coleccionable">Coleccionables</button>
              <button class="list-group-item list-group-item-action" data-categoria="Hogar">Hogar</button>
              <button class="list-group-item list-group-item-action" data-categoria="Ropa">Ropa y Accesorios</button>
              <button class="list-group-item list-group-item-action" data-categoria="Libro">Libros y Guías</button>
            </div>
          </div>
        </aside>

        <!-- Grilla de Productos -->
        <main class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold mb-0">Catálogo de Productos</h3>
            <span class="text-muted small" id="contador-productos-visibles">Mostrando productos...</span>
          </div>

          <div class="row g-4" id="contenedor-todos-los-productos">
            <!-- Inyectado dinámicamente con productos.js -->
          </div>
        </main>
      </div>
    </div>

    <footer class="bg-dark text-white py-4 mt-5">
      <div class="container text-center">
        <p class="mb-1 fw-bold">PokeStore © 2026 - Todos los derechos reservados</p>
        <small class="text-muted">Desarrollado para Evaluación 1 Fullstack II - Duoc UC</small>
      </div>
    </footer>

    <script type="module" src="/js/productos.js"></script>
  </body>
</html>
