<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Sesion</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/buttons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <script src="/js/draw_navbar.js"></script>
    <script src="/js/login.js"></script>

    <!-- Esto es por mientras para redireccionar nada mas -->
    <h2><a href="/pages/homeAdmin.html">HomeAdmin</a></h2>

<div class="page-wrapper">
    <div class="contenedor-lr">
      <div class="header-title">Inicio de sesión</div>

      <form id="login-form" class="form-lr">
        <div class="form-group-lr">
          <label for="login-email">CORREO</label>
          <input type="email" id="login-email" maxlength="100" required>
        </div>

        <div class="form-group-lr">
          <label for="login-password">CONTRASEÑA</label>
          <input type="password" id="login-password" minlength="4" maxlength="10" required>
        </div>

        <button type="submit" class="boton-enviar">Ingresar</button>
        <p id="login-message" class="message"></p>

        <p class="switch-link">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
      </form>
    </div>
  </div>


  </body>
</html>
