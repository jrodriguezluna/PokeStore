<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - PokeStore</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/buttons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <script src="/js/draw_navbar.js"></script>

    <main class="page-wrapper">
      <div class="contenedor-lr">
        <!-- Logo y nombre según mockup Figura 5 del PDF -->
        <div class="text-center pt-4 pb-2">
          <img src="/assets/img/nosotros/pokeball2.png" alt="Logo PokeStore" style="width: 55px; height: 55px; object-fit: contain;">
          <h4 class="mt-2 fw-bold text-dark">PokeStore</h4>
        </div>

        <div class="header-title">Inicio de Sesión</div>

        <form id="login-form" class="form-lr" novalidate>
          <div class="form-group-lr">
            <label for="login-email">CORREO (@duoc.cl, @profesor.duoc.cl o @gmail.com)</label>
            <input type="email" id="login-email" maxlength="100" placeholder="ejemplo@duoc.cl" required autocomplete="username">
          </div>

          <div class="form-group-lr">
            <label for="login-password">CONTRASEÑA (4 a 10 caracteres)</label>
            <input type="password" id="login-password" minlength="4" maxlength="10" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <button type="submit" class="boton-enviar">Ingresar</button>
          
          <div id="login-message" class="text-center mt-2 fw-semibold" style="min-height: 24px;"></div>

          <p class="text-center mt-2 mb-0 small">
            ¿No tienes cuenta? <a href="/pages/registro.html" class="fw-bold">Regístrate aquí</a>
          </p>
        </form>
      </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-auto">
      <div class="container text-center">
        <p class="mb-1 fw-bold">PokeStore © 2026 - Todos los derechos reservados</p>
        <small class="text-muted">Desarrollado para Evaluación 1 Fullstack II - Duoc UC</small>
      </div>
    </footer>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
