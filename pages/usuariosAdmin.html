<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenedor de Usuarios - PokeStore Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/buttons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <script src="/js/draw_navbar_admin.js"></script>

    <div class="container py-5">
      <!-- Cabecera -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Mantenedor de Usuarios</h2>
        <button class="btn btn-success" id="btn-nuevo-usuario">+ Nuevo Usuario</button>
      </div>

      <!-- Tabla de usuarios -->
      <div class="card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th>RUN</th>
                  <th>Nombre</th>
                  <th>Email</th>
                  <th>Rol</th>
                  <th>Fecha Registro</th>
                  <th style="width:150px">Acciones</th>
                </tr>
              </thead>
              <tbody id="tbody-usuarios">
                <!-- contenido dinámico -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Crear / Editar Usuario -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title" id="modalUsuarioLabel">Usuario</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <form id="form-usuario" novalidate>
              <!-- RUN original (oculto para edición) -->
              <input type="hidden" id="user-run-original">

              <div class="row g-3">
                <!-- RUN -->
                <div class="col-12 col-md-4">
                  <label for="user-run" class="form-label fw-semibold">RUN <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="user-run" maxlength="9" placeholder="Ej: 19000001K" required>
                  <div class="form-text">Sin puntos ni guion</div>
                </div>

                <!-- Nombre -->
                <div class="col-12 col-md-4">
                  <label for="user-nombre" class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="user-nombre" maxlength="50" placeholder="Nombre" required>
                </div>

                <!-- Apellidos -->
                <div class="col-12 col-md-4">
                  <label for="user-apellidos" class="form-label fw-semibold">Apellidos <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="user-apellidos" maxlength="100" placeholder="Apellidos" required>
                </div>

                <!-- Email -->
                <div class="col-12 col-md-6">
                  <label for="user-email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                  <input type="email" class="form-control" id="user-email" maxlength="100" placeholder="usuario@email.com" required>
                </div>

                <!-- Contraseña -->
                <div class="col-12 col-md-3">
                  <label for="user-password" class="form-label fw-semibold">Contraseña <span class="text-danger" id="pass-required-mark">*</span></label>
                  <input type="password" class="form-control" id="user-password" minlength="4" maxlength="10" placeholder="4-10 caracteres">
                  <div class="form-text" id="pass-hint"></div>
                </div>

                <!-- Rol -->
                <div class="col-12 col-md-3">
                  <label for="user-rol" class="form-label fw-semibold">Rol <span class="text-danger">*</span></label>
                  <select class="form-select" id="user-rol" required>
                    <option value="Cliente">Cliente</option>
                    <option value="Vendedor">Vendedor</option>
                    <option value="Administrador">Administrador</option>
                  </select>
                </div>

                <!-- Teléfono -->
                <div class="col-12 col-md-4">
                  <label for="user-telefono" class="form-label fw-semibold">Teléfono</label>
                  <input type="tel" class="form-control" id="user-telefono" maxlength="15" placeholder="+56 9 1234 5678">
                </div>

                <!-- Fecha de nacimiento -->
                <div class="col-12 col-md-4">
                  <label for="user-nacimiento" class="form-label fw-semibold">Fecha de Nacimiento</label>
                  <input type="date" class="form-control" id="user-nacimiento">
                </div>

                <!-- Región -->
                <div class="col-12 col-md-4">
                  <label for="user-region" class="form-label fw-semibold">Región</label>
                  <select class="form-select" id="user-region">
                    <option value="">-- Seleccione una región --</option>
                  </select>
                </div>

                <!-- Comuna -->
                <div class="col-12 col-md-6">
                  <label for="user-comuna" class="form-label fw-semibold">Comuna</label>
                  <select class="form-select" id="user-comuna" disabled>
                    <option value="">-- Seleccione una comuna --</option>
                  </select>
                </div>

                <!-- Dirección -->
                <div class="col-12 col-md-6">
                  <label for="user-direccion" class="form-label fw-semibold">Dirección</label>
                  <input type="text" class="form-control" id="user-direccion" maxlength="300" placeholder="Av. Siempre Viva 742">
                </div>
              </div>

              <div id="user-mensaje" class="mt-3 fw-semibold text-center" style="min-height:24px;"></div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-primary" id="btn-guardar-usuario">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/js/usuariosAdmin.js"></script>
  </body>
</html>
