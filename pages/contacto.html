<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeStore</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/buttons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="navbar-placeholder"></div>
    <script src="/js/draw_navbar.js"></script>

<h1 style="text-align: center;">PokeStore</h1>
<div class="contenedor-principal">
  <div class="tarjeta-contacto">
    <h3 class="titulo">Formulario de contacto</h3>
    <form class="formulario">

      <div class="campos">
        <label for="inputName">Nombre Completo</label>
        <input type="text" id="inputName" class="campo-texto">
      </div>
      <div class="campos">
        <label for="inputEmail">Email</label>
        <input type="email" id="inputEmail" class="campo-texto">
      </div>
      <div class="campos">
        <label for="inputContent" class="form-label fw-semibold">Contenido</label>
        <textarea style="resize: none;" class="campo-texto" id="inputContent" rows="4"></textarea>
      </div>
      <button type="submit" class="boton-enviar">Enviar</button>
    </form>
  </div>
</div>

  </body>
</html>
